# Follow the Sectile releases.
#
# Every few hours, and on demand, point Casks/sectile.rb at the latest GitHub
# Release of sebastienferry/sectile, check that the new cask passes Homebrew's
# style and audit and actually installs, then commit it to main. Sectile's own
# release workflow knows nothing of this tap and holds no credential for it:
# this workflow reads public release files and writes with its own token.
name: update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z); empty for the latest release'
        required: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    # macOS, since the check installs the cask.
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # brew audit --online calls the GitHub API; unauthenticated, a shared
      # runner address runs out of its 60 requests an hour.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update the cask
        id: update
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(sh bin/update-cask $TAG)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      # brew tap clones the repository, so it sees only committed files: the
      # cask is committed before the check and pushed only once it passed.
      - name: Commit
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "sectile ${{ steps.update.outputs.version }}"
      - name: Check the cask
        if: steps.update.outputs.changed == 'true'
        run: |
          brew tap sebastienferry/sectile "$GITHUB_WORKSPACE"
          brew style --cask sebastienferry/sectile/sectile
          brew audit --cask --online sebastienferry/sectile/sectile
          brew install --cask sebastienferry/sectile/sectile
          test -d /Applications/Sectile.app
          ! xattr -p com.apple.quarantine /Applications/Sectile.app 2> /dev/null
          brew uninstall --cask sebastienferry/sectile/sectile
      - name: Push
        if: steps.update.outputs.changed == 'true'
        run: git push origin HEAD:main
